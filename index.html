<style>
:root {
  --verde: #37757d;
  --turquesa: #01abbd;
  --menta: #edf5fe;
  --azul-noche: #11354b;

  --arena: #D4B8A0;
  --text: #017576;
  --text-light: #5a7a82;

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--crema); color: var(--text); min-height: 100vh; }
header { background: var(--azul-noche); padding: 0 24px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 300; color: var(--menta); text-decoration: none; }
.logo span { color: var(--turquesa); font-style: italic; }
.cart-btn { background: var(--verde); border: none; border-radius: 50px; padding: 10px 20px; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.cart-count { background: var(--arena); color: var(--azul-noche); border-radius: 50%; width: 20px; height: 20px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.hero { background: linear-gradient(135deg, var(--azul-noche) 0%, var(--verde) 100%); padding: 60px 24px 48px; text-align: center; }
.hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 300; color: white; margin-bottom: 12px; }
.hero p { color: var(--menta); font-size: 0.95rem; margin: 0 auto 24px; }
.filters { padding: 20px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; max-width: 900px; margin: 0 auto; }
.filter-btn { background: white; border: 1.5px solid var(--menta); color: var(--verde); padding: 7px 16px; border-radius: 50px; cursor: pointer; }
.filter-btn.active { background: var(--verde); border-color: var(--verde); color: white; }
.catalog { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.product-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(26,58,74,0.07); display: flex; flex-direction: column; }
.card-img { width: 100%; height: 200px; background: linear-gradient(135deg, #018587, var(--menta)); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
.card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.card-category { font-size: 0.7rem; color: var(--turquesa); font-weight: 500; }
.card-name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: var(--azul-noche); }
.card-price { font-size: 1.1rem; font-weight: 500; color: var(--verde); }
label { font-size: 0.75rem; font-weight: 500; color: var(--text-light); display: block; margin-bottom: 6px; }
.variant-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.variant-btn { border: 1.5px solid var(--menta); background: white; color: var(--text); padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; }
.variant-btn.selected { background: var(--verde); border-color: var(--verde); color: white; }
.variant-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.unit-color-selector { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.unit-label { font-size: 0.7rem; font-weight: 600; color: var(--verde); min-width: 40px; }
.unit-color-grid { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.unit-color-btn { border: 1.5px solid var(--turquesa); background: white; color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }
.unit-color-btn.selected { background: var(--verde); border-color: var(--verde); color: white; }
.unit-color-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.add-btn { margin-top: auto; background: var(--verde); color: white; border: none; border-radius: 10px; padding: 12px; cursor: pointer; font-weight: 500; }
.add-btn:hover { background: var(--turquesa); }
.add-btn:disabled { background: #ccc; cursor: not-allowed; }
.cart-overlay { position: fixed; inset: 0; background: rgba(26,58,74,0.5); z-index: 200; opacity: 0; pointer-events: none; }
.cart-overlay.open { opacity: 1; pointer-events: all; }
.cart-panel { position: fixed; top: 0; right: 0; width: min(420px, 100vw); height: 100vh; background: var(--crema); z-index: 201; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; }
.cart-panel.open { transform: translateX(0); }
.cart-header { background: var(--azul-noche); padding: 20px 24px; display: flex; justify-content: space-between; color: white; }
.cart-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 300; color: var(--menta); }
.close-btn { background: none; border: none; color: var(--menta); font-size: 1.5rem; cursor: pointer; }
.cart-items { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cart-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-light); font-size: 0.9rem; }
.cart-item { background: white; border-radius: 12px; padding: 14px; display: flex; gap: 12px; box-shadow: 0 1px 6px rgba(26,58,74,0.06); }
.cart-item-icon { width: 48px; height: 48px; background: #018587; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
.cart-item-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: var(--azul-noche); }
.cart-item-variant { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
.cart-item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.remove-item { background: none; border: none; color: var(--arena); cursor: pointer; }
.cart-footer { padding: 16px 20px; background: white; border-top: 1px solid var(--menta); }
.cart-total-value { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--azul-noche); }
.whatsapp-btn { width: 100%; background: #25D366; color: white; border: none; border-radius: 12px; padding: 15px; cursor: pointer; font-weight: 600; margin-top: 10px; }
.envios-banner { background: var(--verde); padding: 20px 24px; text-align: center; max-width: 900px; margin: 0 auto; }
.envios-banner h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: white; }
footer { background: var(--azul-noche); padding: 28px 24px; text-align: center; color: var(--menta); font-size: 0.8rem; }
footer a { color: var(--turquesa); text-decoration: none; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--verde); color: white; padding: 12px 24px; border-radius: 50px; font-size: 0.85rem; z-index: 999; transition: transform 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); }
@media (max-width: 480px) {
  .catalog { grid-template-columns: 1fr 1fr; gap: 12px; }

</style>

function cardVar(p) {
  const vars = p.var.map(v => `<button class="variant-btn" onclick="selVar('${p.id}','${v.id}',this)" ${v.s?'':'disabled'}>${v.l}</button>`).join('');
  return `<div class="product-card"><div class="card-img">${p.emoji}</div><div class="card-body"><div class="card-category">${p.cat}</div><div class="card-name">${p.name}</div><div class="card-price">$${p.px.toLocaleString('es-AR')}</div><label>Talle y color</label><div class="variant-grid">${vars}</div><button class="add-btn" id="btn${p.id}" onclick="addVar('${p.id}')" disabled>Selecciona</button></div></div>`;
}

function cardMulti(p) {
  const qtys = p.precios.map(pr => `<button class="variant-btn" onclick="selQty('${p.id}',${pr.qty},this)">${pr.qty} x $${pr.px.toLocaleString('es-AR')}</button>`).join('');
  return `<div class="product-card"><div class="card-img">${p.emoji}</div><div class="card-body"><div class="card-category">${p.talle}</div><div class="card-name">${p.name}</div><div class="card-price">$${p.precios[0].px.toLocaleString('es-AR')} c/u</div><label>Cantidad</label><div class="variant-grid">${qtys}</div><div id="cols${p.id}" style="display:none"><label>Color por unidad</label><div id="colslist${p.id}"></div></div><button class="add-btn" id="btn${p.id}" onclick="addMulti('${p.id}')" disabled>Selecciona</button></div></div>`;
}

function selVar(pid,vid,btn) {
  const p = productos.find(x=>x.id===pid);
  document.querySelectorAll(`#catalog .product-card`).forEach((card,i)=>{
    if(productos[i].id===pid) {
      card.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('selected'));
    }
  });
  btn.classList.add('selected');
  sel[pid] = {var:vid};
  document.getElementById(`btn${pid}`).disabled = false;
}

function selQty(pid,qty,btn) {
  const p = productos.find(x=>x.id===pid);
  document.querySelectorAll(`#catalog .product-card`).forEach((card,i)=>{
    if(productos[i].id===pid) {
      card.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('selected'));
    }
  });
  btn.classList.add('selected');
  sel[pid] = {qty,cols:{}};
  document.getElementById(`cols${pid}`).style.display='block';
  let html='';
  for(let i=1;i<=qty;i++) {
    html += `<div class="unit-color-selector"><span class="unit-label">U${i}</span><div class="unit-color-grid">`;
    p.colores.forEach(c => {
      html += `<button class="unit-color-btn" onclick="selCol('${pid}',${i},'${c.c}',this)" ${c.s?'':'disabled'}>${c.c}</button>`;
    });
    html += '</div></div>';
  }
  document.getElementById(`colslist${pid}`).innerHTML = html;
  upQty(pid);
}

function selCol(pid,u,col,btn) {
  btn.parentElement.querySelectorAll('.unit-color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  sel[pid].cols[u] = col;
  upQty(pid);
}

function upQty(pid) {
  const s = sel[pid];
  const btn = document.getElementById(`btn${pid}`);
  const p = productos.find(x=>x.id===pid);
  if(!s||!s.qty||Object.keys(s.cols).length !== s.qty) {
    btn.disabled = true;
    btn.textContent = 'Elige colores';
    return;
  }
  const px = p.precios.find(x=>x.qty===s.qty).px;
  btn.disabled = false;
  btn.textContent = `+ Agregar $${px.toLocaleString('es-AR')}`;
}

function addSimple(pid) {
  const p = productos.find(x=>x.id===pid);
  carrito.push({name:p.name,det:`x1`,px:p.px,emoji:p.emoji});
  upCart();
  toast(`✓ ${p.name}`);
}

function addVar(pid) {
  const p = productos.find(x=>x.id===pid);
  const v = sel[pid];
  if(!v||!v.var) return;
  const var_label = p.var.find(x=>x.id===v.var).l;
  carrito.push({name:p.name,det:var_label,px:p.px,emoji:p.emoji});
  upCart();
  toast(`✓ ${p.name}`);
}

function addMulti(pid) {
  const p = productos.find(x=>x.id===pid);
  const s = sel[pid];
  if(!s||!s.qty) return;
  const px = p.precios.find(x=>x.qty===s.qty).px;
  const cols = Object.entries(s.cols).sort((a,b)=>a[0]-b[0]).map(e=>e[1]).join(', ');
  carrito.push({name:p.name,det:`${s.qty}x ${p.talle} - ${cols}`,px,emoji:p.emoji});
  upCart();
  toast(`✓ ${s.qty}x ${p.name}`);
}

function upCart() {
  const cnt = carrito.length;
  document.getElementById('cartCount').textContent = cnt;
  const total = carrito.reduce((a,b)=>a+b.px,0);
  let html = cnt===0 ? '<div class="cart-empty"><p>Carrito vacío</p></div>' : carrito.map((item,i) => 
    `<div class="cart-item"><div class="cart-item-icon">${item.emoji}</div><div style="flex:1"><div class="cart-item-name">${item.name}</div><div class="cart-item-variant">${item.det}</div><div class="cart-item-bottom"><span>$${item.px.toLocaleString('es-AR')}</span><button class="remove-item" onclick="carrito.splice(${i},1);upCart()">🗑</button></div></div></div>`
  ).join('');
  document.getElementById('cartItems').innerHTML = html;
  document.getElementById('cartTotal').textContent = `$${total.toLocaleString('es-AR')}`;
  document.getElementById('waBtn').disabled = cnt===0;
}

function finalizarPedido() {
  if(carrito.length===0) return;
  const total = carrito.reduce((a,b)=>a+b.px,0);
  const msg = '¡Hola!\nQuiero comprar:\n\n' + carrito.map(i => `• ${i.name} (${i.det}) - $${i.px.toLocaleString('es-AR')}`).join('\n') + `\n\nTOTAL: $${total.toLocaleString('es-AR')}`;
  window.open(`https://wa.me/5492944589885?text=${encodeURIComponent(msg)}`,'_blank');
}

function toggleCart() {
  document.getElementById('cartPanel').classList.toggle('open');
  document.getElementById('cartOverlay').classList.toggle('open');
}

function filtrar(cat,btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtrados = cat === 'todos' ? productos : productos.filter(p => p.cat === cat);
  const html = filtrados.map(p => {
    if(p.tipo === 'simple') return cardSimple(p);
    if(p.tipo === 'var') return cardVar(p);
    if(p.tipo === 'multi') return cardMulti(p);
  }).join('');
  document.getElementById('catalog').innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function init() {
  const html = productos.map(p => {
    if(p.tipo === 'simple') return cardSimple(p);
    if(p.tipo === 'var') return cardVar(p);
    if(p.tipo === 'multi') return cardMulti(p);
  }).join('');
  document.getElementById('catalog').innerHTML = html;
  upCart();
}

init();
</script>
</body>
</html>
